version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: dev
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    groups:
      cargo-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    groups:
      npm-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
