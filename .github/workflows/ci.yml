name: CI

on:
  workflow_call:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: ci-quality-${{ github.workflow }}-${{ github.ref }}
      # Reusable calls inherit the caller's workflow name; release checks must finish.
      cancel-in-progress: ${{ github.workflow == 'CI' && github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install configured tools
        id: mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: "2026.10.21"
          cache: false
      - name: Install and verify project Rust components
        run: |
          # mise's override hides the components declared in rust-toolchain.toml.
          env -u RUSTUP_TOOLCHAIN rustup show
          rustup component list --installed
          cargo fmt --version
          cargo clippy --version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ fromJSON(steps.mise.outputs.versions).node[0].version }}
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1; packageManager version
      - run: pnpm install --frozen-lockfile
      - name: Quality checks
        run: pnpm check
      - name: Check tracked generated files
        run: git diff --exit-code
      - name: Build release binary with embedded UI
        run: pnpm build
      - name: Smoke test release binary
        run: node scripts/release/smoke.mjs target/release/ltm
