name: CI

on:
  workflow_call:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: ci-quality-${{ github.workflow }}-${{ github.ref }}
      # Reusable calls inherit the caller's workflow name; release checks must finish.
      cancel-in-progress: ${{ github.workflow == 'CI' && github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install configured tools
        id: mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: "2026.10.21"
          cache: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ fromJSON(steps.mise.outputs.versions).node[0].version }}
          package-manager-cache: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0; packageManager version
      - run: pnpm install --frozen-lockfile
      - name: Quality checks
        run: pnpm check
      - name: Check tracked generated files
        run: git diff --exit-code
      - name: Build release binary with embedded UI
        run: pnpm build
      - name: Smoke test release binary
        run: node scripts/release/smoke.mjs target/release/ltm
